openapi: 3.0.3
info:
  title: DevDex API
  description: API documentation for DevDex - A developer blog platform with authentication, posts, comments, and payment integration
  version: 1.0.0
  contact:
    name: DevDex Support

servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User management operations
  - name: Posts
    description: Blog post operations
  - name: Comments
    description: Comment operations
  - name: Upload
    description: File upload operations
  - name: Payment
    description: Stripe payment integration

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: JWT token stored in HTTP-only cookie

  schemas:
    User:
      type: object
      required:
        - username
        - email
        - password
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
          example: "507f1f77bcf86cd799439011"
        username:
          type: string
          description: Unique username
          example: "johndoe"
        email:
          type: string
          format: email
          description: Unique email address
          example: "john@example.com"
        password:
          type: string
          format: password
          description: Hashed password (bcrypt)
          writeOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    UserResponse:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        username:
          type: string
          example: "johndoe"
        email:
          type: string
          example: "john@example.com"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Post:
      type: object
      required:
        - title
        - desc
        - username
        - userId
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
          readOnly: true
        title:
          type: string
          description: Unique post title
          example: "Getting Started with Node.js"
        desc:
          type: string
          description: Post content/description
          example: "This is a comprehensive guide to Node.js..."
        photo:
          type: string
          description: URL or path to post image
          example: "http://localhost:5000/images/post1.jpg"
        username:
          type: string
          description: Author username
          example: "johndoe"
        userId:
          type: string
          description: Author user ID
          example: "507f1f77bcf86cd799439011"
        categories:
          type: array
          items:
            type: string
          description: Post categories/tags
          example: ["nodejs", "javascript", "backend"]
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Comment:
      type: object
      required:
        - comment
        - author
        - postId
        - userId
      properties:
        _id:
          type: string
          description: MongoDB ObjectId
          readOnly: true
        comment:
          type: string
          description: Comment text
          example: "Great article! Very helpful."
        author:
          type: string
          description: Comment author username
          example: "janedoe"
        postId:
          type: string
          description: Associated post ID
          example: "507f1f77bcf86cd799439011"
        userId:
          type: string
          description: Comment author user ID
          example: "507f1f77bcf86cd799439012"
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    Error:
      type: object
      properties:
        message:
          type: string
          example: "An error occurred"

    TokenData:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        username:
          type: string
          example: "johndoe"
        email:
          type: string
          example: "john@example.com"

paths:
  # Authentication Endpoints
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new user account with username, email, and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  example: "johndoe"
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                password:
                  type: string
                  format: password
                  example: "securePassword123"
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user and set JWT token in cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                password:
                  type: string
                  format: password
                  example: "securePassword123"
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; Path=/; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: User not found
          content:
            application/json:
              schema:
                type: string
                example: "User not found"
        '401':
          description: Wrong password
          content:
            application/json:
              schema:
                type: string
                example: "Wrong password"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout:
    get:
      tags:
        - Authentication
      summary: Logout user
      description: Clear authentication token cookie
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: string
                example: "User Logged out"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/refetch:
    get:
      tags:
        - Authentication
      summary: Refetch user data
      description: Get current user data from JWT token (used to persist login state)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: User data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenData'
        '404':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # User Endpoints
  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieve user information (password excluded)
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: User data retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Users
      summary: Update user
      description: Update user information (requires authentication)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "newusername"
                email:
                  type: string
                  format: email
                  example: "newemail@example.com"
                password:
                  type: string
                  format: password
                  example: "newPassword123"
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: string
                example: "You are not authenticated"
        '403':
          description: Invalid token
          content:
            application/json:
              schema:
                type: string
                example: "You are not valid"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Users
      summary: Delete user
      description: Delete user and all associated posts and comments (requires authentication)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: string
                example: "User has been deleted!"
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: string
                example: "You are not authenticated"
        '403':
          description: Invalid token
          content:
            application/json:
              schema:
                type: string
                example: "You are not valid"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Post Endpoints
  /api/posts/create:
    post:
      tags:
        - Posts
      summary: Create a new post
      description: Create a new blog post (requires authentication)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - desc
                - username
                - userId
              properties:
                title:
                  type: string
                  example: "My First Blog Post"
                desc:
                  type: string
                  example: "This is the content of my blog post..."
                photo:
                  type: string
                  example: "http://localhost:5000/images/post1.jpg"
                username:
                  type: string
                  example: "johndoe"
                userId:
                  type: string
                  example: "507f1f77bcf86cd799439011"
                categories:
                  type: array
                  items:
                    type: string
                  example: ["javascript", "nodejs"]
      responses:
        '200':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: string
                example: "You are not authenticated"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts/{id}:
    get:
      tags:
        - Posts
      summary: Get post by ID
      description: Retrieve a specific post by its ID
      parameters:
        - name: id
          in: path
          required: true
          description: Post ID
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Post retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Posts
      summary: Update post
      description: Update an existing post (requires authentication)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Post ID
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: "Updated Post Title"
                desc:
                  type: string
                  example: "Updated content..."
                photo:
                  type: string
                  example: "http://localhost:5000/images/updated.jpg"
                categories:
                  type: array
                  items:
                    type: string
                  example: ["updated", "tags"]
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: string
                example: "You are not authenticated"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Posts
      summary: Delete post
      description: Delete a post and all associated comments (requires authentication)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Post ID
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Post deleted successfully
          content:
            application/json:
              schema:
                type: string
                example: "Post has been deleted!"
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: string
                example: "You are not authenticated"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts:
    get:
      tags:
        - Posts
      summary: Get all posts or search posts
      description: Retrieve all posts or search posts by title
      parameters:
        - name: search
          in: query
          required: false
          description: Search term to filter posts by title (case-insensitive)
          schema:
            type: string
            example: "nodejs"
      responses:
        '200':
          description: Posts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/posts/user/{userId}:
    get:
      tags:
        - Posts
      summary: Get posts by user
      description: Retrieve all posts created by a specific user
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: User posts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Comment Endpoints
  /api/comments/create:
    post:
      tags:
        - Comments
      summary: Create a new comment
      description: Add a comment to a post (requires authentication)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - comment
                - author
                - postId
                - userId
              properties:
                comment:
                  type: string
                  example: "Great post! Very informative."
                author:
                  type: string
                  example: "janedoe"
                postId:
                  type: string
                  example: "507f1f77bcf86cd799439011"
                userId:
                  type: string
                  example: "507f1f77bcf86cd799439012"
      responses:
        '200':
          description: Comment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: string
                example: "You are not authenticated"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/comments/{id}:
    put:
      tags:
        - Comments
      summary: Update comment
      description: Update an existing comment (requires authentication)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Comment ID
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
                  example: "Updated comment text"
      responses:
        '200':
          description: Comment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: string
                example: "You are not authenticated"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Comments
      summary: Delete comment
      description: Delete a comment (requires authentication)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Comment ID
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Comment deleted successfully
          content:
            application/json:
              schema:
                type: string
                example: "Comment has been deleted!"
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                type: string
                example: "You are not authenticated"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/comments/post/{postId}:
    get:
      tags:
        - Comments
      summary: Get comments by post
      description: Retrieve all comments for a specific post
      parameters:
        - name: postId
          in: path
          required: true
          description: Post ID
          schema:
            type: string
            example: "507f1f77bcf86cd799439011"
      responses:
        '200':
          description: Comments retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # File Upload Endpoint
  /api/upload:
    post:
      tags:
        - Upload
      summary: Upload an image
      description: Upload an image file to the server
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file to upload
      responses:
        '200':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: string
                example: "Image has been uploaded successfully"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Payment Endpoint
  /api/checkout:
    post:
      tags:
        - Payment
      summary: Create Stripe checkout session
      description: Create a Stripe checkout session for "buy me a coffee" payment
      responses:
        '200':
          description: Checkout session created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: Stripe checkout session URL
                    example: "https://checkout.stripe.com/pay/cs_test_..."
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: string
                example: "Internal Server Error"
